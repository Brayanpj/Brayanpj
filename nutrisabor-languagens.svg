
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 320 120">
  <rect width="319" height="119" x="0.5" y="0.5" rx="4.5" fill="#1a1b27" stroke="#414868"/>

  <g font-family="Segoe UI, Ubuntu, Sans-Serif" fill="#a9b1d6">
    <text x="25" y="25" font-size="14" fill="#70a5fd">Most Used Languages</text>

    <rect x="25" y="37" width="270" height="8" rx="2" fill="#24283b"/>

    <clipPath id="language-bar">
      <rect x="25" y="37" width="270" height="8" rx="2"/>
    </clipPath>

    <g clip-path="url(#language-bar)">
      <rect x="25" y="37" width="247.86" height="8" fill="#3178c6"/>
      <rect x="272.86" y="37" width="22.14" height="8" fill="#f1e05a"/>
    </g>

    <circle cx="29" cy="68" r="3" fill="#3178c6"/>
    <text x="39" y="72" font-size="11">TypeScript</text>
    <text x="295" y="72" font-size="11" text-anchor="end">91.8%</text>

    <circle cx="29" cy="92" r="3" fill="#f1e05a"/>
    <text x="39" y="96" font-size="11">JavaScript</text>
    <text x="295" y="96" font-size="11" text-anchor="end">8.2%</text>
  </g>
</svg>
